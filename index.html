  "no-speech": "소리가 들리지 않았습니다. 마이크를 확인하고 다시 눌러 말해 보세요.",
  "audio-capture": "마이크를 찾지 못했습니다. 기기에 마이크가 연결되어 있는지 확인해 주세요.",
  "network": "네트워크 문제로 음성 인식이 멈췄습니다. 연결을 확인한 뒤 다시 시도해 주세요.",
  "aborted": "음성 입력이 중단되었습니다."
};

function useSpeech(onFinal) {
  const supported = useMemo(() => !!(window.SpeechRecognition || window.webkitSpeechRecognition), []);
  const [listening, setListening] = useState(false);
  const [interim, setInterim] = useState("");
  const [error, setError] = useState(null);
  const recRef = useRef(null);
  const cbRef = useRef(onFinal);
  cbRef.current = onFinal;

  const stop = useCallback(() => {
    try { if (recRef.current) recRef.current.stop(); } catch (e) { /* 이미 종료됨 */ }
    setListening(false); setInterim("");
  }, []);

  const start = useCallback(() => {
    if (!supported) return;
    setError(null);
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = "ko-KR"; rec.continuous = true; rec.interimResults = true;
    rec.onresult = (ev) => {
      let fin = "", itm = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) fin += r[0].transcript; else itm += r[0].transcript;
      }
      if (fin.trim()) cbRef.current(fin.trim());
      setInterim(itm);
    };
    rec.onerror = (ev) => { setError(ev.error || "unknown"); setListening(false); setInterim(""); };
    rec.onend = () => { setListening(false); setInterim(""); };
    try { rec.start(); recRef.current = rec; setListening(true); }
    catch (e) { setError("aborted"); }
  }, [supported]);

  useEffect(() => () => { try { if (recRef.current) recRef.current.stop(); } catch (e) {} }, []);
  return { supported, listening, interim, error, start, stop };
}

/* ─────────────────────────── AI 첨삭 ─────────────────────────── */
function useSampler() {
  const ref = useRef(null);
  const [state, setState] = useState("checking");
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const s = (window.claude && window.claude.use) ? await window.claude.use("sample") : null;
        if (!alive) return;
        ref.current = s || null;
        setState(s ? "ready" : "none");
      } catch (e) { if (alive) { ref.current = null; setState("none"); } }
    })();
    return () => { alive = false; };
  }, []);
  return [state, ref];
}

function buildPrompt(p, answer, hintsUsed) {
  return [
    "당신은 자율형 고등학교 수학 구술면접의 채점 위원입니다. 중학교 3학년 학생의 구술 답변을 평가합니다.",
    "평가 원칙: (1) 예시 몇 개를 들어 보인 것은 증명이 아니다. (2) 결론이 맞았는지보다 근거가 이어졌는지를 본다. (3) 중학교 교육과정 안의 언어로 설명했는지 본다. (4) 틀린 부분은 정답을 바로 알려주지 말고 스스로 고치도록 되묻는다. (5) 학생은 말로 답했으므로 문장이 거칠거나 구어체인 것은 감점하지 않는다.",
    "[문제]\n" + p.prompt,
    "[채점 기준]\n" + p.rubric.map(r => "- " + r.label + " (" + r.points + "점)").join("\n"),
    "[모범 답안 요지]\n" + p.model.map(m => "- " + m).join("\n"),
    "[학생이 사용한 힌트] " + hintsUsed + "개 / 총 " + p.hints.length + "개",
    "[학생 답변]\n\"\"\"\n" + answer + "\n\"\"\"",
    "아래 JSON 형식으로만 답하세요. 다른 말은 쓰지 마세요. 모든 문장은 한국어 존댓말로, 중3이 읽고 바로 이해할 수 있게 쓰세요.",
    '{"score": 0부터 100 사이 정수, "oneLine": "한 문장 총평", "good": ["잘한 점", "..."], "missing": ["놓친 점", "..."], "rubric": [{"label": "채점 기준 문구를 그대로", "mark": "O 또는 △ 또는 X", "comment": "한 문장 근거"}], "nextQuestion": "면접관이 이어서 던질 꼬리질문 한 개"}'
  ].join("\n\n");
}

async function gradeAnswer({ sampler, apiKey, model, problem, answer, hintsUsed }) {
  const prompt = buildPrompt(problem, answer, hintsUsed);
  if (sampler) return await sampler.json(prompt, { modelTier: "complex" });
  if (apiKey) {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({ model: model, max_tokens: 1600, messages: [{ role: "user", content: prompt }] })
    });
    if (!res.ok) throw new Error("API가 " + res.status + " 오류를 돌려주었습니다. 키와 모델 이름을 확인해 주세요.");
    const data = await res.json();
    const text = (data.content || []).map(c => c.text || "").join("");
    const m = text.match(/\{[\s\S]*\}/);
    if (!m) throw new Error("AI 응답에서 채점 결과를 읽지 못했습니다. 다시 시도해 주세요.");
    return JSON.parse(m[0]);
  }
  throw new Error("AI 첨삭을 쓸 수 없습니다.");
}

/* ─────────────────────────── 작은 부품 ─────────────────────────── */
const stars = (n) => "★".repeat(n) + "☆".repeat(3 - n);
const mmss = (s) => String(Math.floor(Math.max(0, s) / 60)).padStart(2, "0") + ":" + String(Math.max(0, s) % 60).padStart(2, "0");

function Chip({ children, tone = "neutral", className = "" }) {
  const tones = {
    neutral: "bg-raise text-ink2 border-line",
    accent: "bg-accentSoft text-accent border-transparent",
    pen: "bg-penSoft text-pen border-transparent",
    good: "bg-goodSoft text-good border-transparent"
  };
  return <span className={"inline-flex items-center gap-1 border px-2 py-[3px] text-[11px] font-medium rounded-xs " + tones[tone] + " " + className}>{children}</span>;
}

function Btn({ children, onClick, variant = "ghost", disabled, className = "", type = "button", title }) {
  const base = "inline-flex items-center justify-center gap-2 px-3.5 py-2 text-[13px] font-medium rounded-xs transition-colors disabled:opacity-40 disabled:cursor-not-allowed";
  const v = {
    solid: "bg-accent text-paper hover:bg-accent2",
    pen: "bg-pen text-paper hover:opacity-90",
    ghost: "border border-line2 text-ink hover:bg-raise",
    quiet: "text-ink2 hover:text-ink hover:bg-raise"
  };
  return <button type={type} title={title} onClick={onClick} disabled={disabled} className={base + " " + v[variant] + " " + className}>{children}</button>;
}

function Card({ children, className = "" }) {
  return <section className={"bg-card border border-line rounded-xs shadow-soft " + className}>{children}</section>;
}

function CardHead({ label, note, right }) {
  return (
    <div className="flex items-center justify-between gap-3 px-5 py-3 border-b border-line">
      <div className="flex items-baseline gap-2.5 min-w-0">
        <h3 className="eyebrow text-accent shrink-0">{label}</h3>
        {note && <span className="text-[12px] text-ink3 truncate">{note}</span>}
      </div>
      {right}
    </div>

}

/* ─────────────────────────── 타이머 ─────────────────────────── */
function Timer({ total, resetKey }) {
  const [left, setLeft] = useState(total);
  const [running, setRunning] = useState(false);
  useEffect(() => { setLeft(total); setRunning(false); }, [resetKey, total]);
  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => setLeft(v => { if (v <= 1) { setRunning(false); return 0; } return v - 1; }), 1000);
    return () => clearInterval(id);
  }, [running]);
  const over = left === 0;
  const near = left > 0 && left <= 30;
  return (
    <div className="flex items-center gap-2">
      <div className={"mono text-[22px] font-semibold leading-none tabular-nums " + (over || near ? "text-pen" : "text-ink")} aria-live="off">
        {mmss(left)}
      </div>
      <Btn variant="quiet" className="px-2 py-1" onClick={() => setRunning(r => !r)} disabled={over}>
        {running ? "일시정지" : "시작"}
      </Btn>
      <Btn variant="quiet" className="px-2 py-1" onClick={() => { setLeft(total); setRunning(false); }}>되돌리기</Btn>
    </div>
  );
}

  const appendSpoken = useCallback((text) => {
    update(r => ({ ...r, answer: (r.answer ? r.answer.replace(/\s*$/, "") + " " : "") + text }));
  }, [update]);
  const speech = useSpeech(appendSpoken);

  useEffect(() => { setAiError(null); setConfirmReveal(false); speech.stop(); }, [p.id]);

  const checks = rec.checks.length === p.rubric.length ? rec.checks : p.rubric.map(() => false);

    if (!hasAnswer) return;
    setAiBusy(true); setAiError(null);
    try {
      const out = await gradeAnswer({
        sampler: sampler.current, apiKey: settings.apiKey, model: settings.model,
        problem: p, answer: rec.answer, hintsUsed: rec.hintsUsed
      });
      update(r => ({ ...r, ai: out, revealed: true }));
    } catch (e) {
      setAiError((e && e.message) ? e.message : "첨삭을 받지 못했습니다. 잠시 뒤 다시 시도해 주세요.");
    } finally { setAiBusy(false); }

            <Timer total={p.minutes * 60} resetKey={p.id} />

              {p.rubric.map((r, i) => (
                <li key={i}>
                  <label className="flex items-start gap-3 py-2.5 border-t border-line cursor-pointer group">
                    <input
                      id={p.id + "-rub-" + i}
                      type="checkbox"
                      checked={!!checks[i]}
                      onChange={() => update(rr => {
                        const base = rr.checks.length === p.rubric.length ? rr.checks.slice() : p.rubric.map(() => false);
                        base[i] = !base[i];
                        return { ...rr, checks: base, selfDone: true };
                      })}
                      className="mt-[3px] h-4 w-4 accent-[var(--accent)] shrink-0"
                    />
                    <span className="text-[13.5px] leading-relaxed text-ink flex-1">{r.label}</span>
                    <span className="mono text-[12px] text-ink3 shrink-0">{r.points}</span>
                  </label>
                </li>
              ))}
            </ul>
          </div>
        </div>
      </Card>

      {/* 모범답안 */}
      <Card>
        <CardHead label="모범 답안과 출제 의도" note={rec.revealed ? null : "먼저 스스로 답해 본 뒤에 여세요"} />
        <div className="p-5">
          {!rec.revealed ? (
            <div className="flex flex-col items-start gap-3">
              {answerLen < 40 && !confirmReveal ? (
                <>
                  <p className="text-[13.5px] text-ink2 leading-relaxed max-w-[46em]">
                    아직 답변이 짧습니다. 구술면접에서는 막혀도 “여기까지는 알겠는데 이 부분이 걸립니다”라고 말하는 것 자체가 점수입니다. 그래도 지금 열까요?
                  </p>
                  <Btn onClick={() => setConfirmReveal(true)}>그래도 열기</Btn>
                </>
              ) : (
                <Btn variant="solid" onClick={() => update(r => ({ ...r, revealed: true }))}>모범 답안 열기</Btn>
              )}
            </div>
          ) : (
            <div className="flex flex-col gap-6 fadein">
              <div>
                <h4 className="eyebrow text-accent mb-2">출제 의도</h4>
                <p className="text-[14px] leading-[1.85] text-ink2 max-w-[46em]">{p.intent}</p>
              </div>
              <div>
                <h4 className="eyebrow text-accent mb-2">답변의 뼈대</h4>
                <ol className="flex flex-col gap-2.5 max-w-[46em]">
                  {p.model.map((m, i) => (
                    <li key={i} className="flex gap-3">
                      <span className="mono text-[12px] text-ink3 pt-[4px] shrink-0">{i + 1}</span>
                      <p className="serif text-[15.5px] leading-[1.8] text-ink">{m}</p>
                    </li>
                  ))}
                </ol>
              </div>
              <div>
                <h4 className="eyebrow text-pen mb-2">실제로 이어지는 꼬리질문</h4>
                <ul className="flex flex-col gap-2 max-w-[46em]">
                  {p.followups.map((f, i) => (
                    <li key={i} className="flex gap-3">
                      <span className="text-pen shrink-0">—</span>
                      <p className="text-[14px] leading-relaxed text-ink">{f}</p>
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          )}
        </div>
      </Card>
    </div>
  );
}

/* ─────────────────────────── 진행 현황 ─────────────────────────── */
function Progress({ store, onPick, onReset }) {
  const rows = PROBLEMS.map(p => {
    const r = store[p.id] || blank();
    const checks = r.checks.length === p.rubric.length ? r.checks : p.rubric.map(() => false);
    const self = p.rubric.reduce((s, rb, i) => s + (checks[i] ? rb.points : 0), 0);
    return { p, r, self, hasAnswer: !!r.answer.trim() };
  });
  const done = rows.filter(x => x.r.selfDone || x.r.ai).length;
  const aiScores = rows.filter(x => x.r.ai && typeof x.r.ai.score === "number").map(x => x.r.ai.score);
  const avg = aiScores.length ? Math.round(aiScores.reduce((a, b) => a + b, 0) / aiScores.length) : null;

  return (
    <Card>
      <CardHead
        label="진행 현황"
        note={done + "문항 채점 완료 · 전체 " + PROBLEMS.length + "문항"}
        right={<div className="flex gap-2 no-print">
          <Btn variant="quiet" className="px-2 py-1" onClick={() => window.print()}>인쇄</Btn>
          <Btn variant="quiet" className="px-2 py-1" onClick={onReset}>전체 초기화</Btn>
        </div>}
      />
      <div className="p-5">
        <div className="flex flex-wrap gap-6 pb-5 mb-1 border-b border-line">
          <div><div className="eyebrow text-ink3 mb-1">채점 완료</div><div className="mono text-[24px] font-semibold">{done}<span className="text-[14px] text-ink3"> / {PROBLEMS.length}</span></div></div>
          <div><div className="eyebrow text-ink3 mb-1">AI 평균 점수</div><div className="mono text-[24px] font-semibold">{avg === null ? <span className="text-[14px] text-ink3">아직 없음</span> : avg}</div></div>
          <div><div className="eyebrow text-ink3 mb-1">사용한 힌트</div><div className="mono text-[24px] font-semibold">{rows.reduce((s, x) => s + x.r.hintsUsed, 0)}</div></div>
        </div>
        <div className="overflow-x-auto scroller">
          <table className="w-full text-[13px] min-w-[560px]">
            <thead>
              <tr className="text-ink3">
                <th className="text-left font-medium py-2 pr-3 w-10">번호</th>
                <th className="text-left font-medium py-2 pr-3">문항</th>
                <th className="text-left font-medium py-2 pr-3 w-24">상태</th>
                <th className="text-right font-medium py-2 pr-3 w-20">자가</th>
                <th className="text-right font-medium py-2 pr-3 w-20">AI</th>
                <th className="text-right font-medium py-2 w-16">힌트</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(({ p, r, self, hasAnswer }) => (
                <tr key={p.id} className="border-t border-line">
                  <td className="mono py-2.5 pr-3 text-ink3">{String(p.no).padStart(2, "0")}</td>
                  <td className="py-2.5 pr-3">
                    <button className="text-left hover:text-accent no-print" onClick={() => onPick(p.id)}>{p.title}</button>
                    <span className="hidden print:inline">{p.title}</span>
                    <div className="text-[11px] text-ink3 mt-0.5">{p.area}</div>
                  </td>
                  <td className="py-2.5 pr-3">
                    {(r.selfDone || r.ai) ? <Chip tone="good">채점함</Chip> : hasAnswer ? <Chip tone="accent">작성 중</Chip> : <Chip>시작 전</Chip>}
                  </td>
                  <td className="mono py-2.5 pr-3 text-right">{r.selfDone ? self : "—"}</td>
                  <td className="mono py-2.5 pr-3 text-right text-pen">{r.ai && typeof r.ai.score === "number" ? r.ai.score : "—"}</td>
                  <td className="mono py-2.5 text-right text-ink3">{r.hintsUsed}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </Card>
  );
}

/* ─────────────────────────── 교사 설정 ─────────────────────────── */
function Settings({ settings, setSettings, samplerState, onClose }) {
  const [key, setKey] = useState(settings.apiKey);
  const [model, setModel] = useState(settings.model);
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center p-4 sm:p-8 bg-[rgba(10,16,20,.55)] overflow-y-auto no-print" role="dialog" aria-modal="true">
      <Card className="w-full max-w-[560px] mt-8">
        <CardHead label="교사용 설정" right={<Btn variant="quiet" className="px-2 py-1" onClick={onClose}>닫기</Btn>} />
        <div className="p-5 flex flex-col gap-5">
          <div className={"px-4 py-3 rounded-xs text-[13px] leading-relaxed " + (samplerState === "ready" ? "bg-goodSoft text-good" : "bg-raise text-ink2 border border-line")}>
            {samplerState === "checking" && "AI 첨삭 사용 가능 여부를 확인하는 중입니다…"}
            {samplerState === "ready" && "이 화면에서는 클로드 내장 첨삭이 바로 작동합니다. API 키를 넣을 필요가 없습니다."}
            {samplerState === "none" && "이 화면에서는 클로드 내장 첨삭을 쓸 수 없습니다(저장된 HTML 파일을 직접 열었을 때). 아래에 API 키를 넣으면 AI 첨삭이 켜집니다."}
          </div>
          <div className="flex flex-col gap-2">
            <label htmlFor="apikey" className="eyebrow text-ink2">Anthropic API 키</label>
            <input id="apikey" type="password" value={key} onChange={e => setKey(e.target.value)} placeholder="sk-ant-…"
              className="bg-raise border border-line rounded-xs px-3 py-2 text-[13px] mono" autoComplete="off" />
            <p className="text-[12px] text-ink2 leading-relaxed">
              키는 이 브라우저 안에만 저장되고 어디로도 전송되지 않습니다. 다만 <strong className="text-pen font-semibold">학생에게 나눠 줄 파일에는 키를 넣지 마세요</strong> — 파일을 받은 사람이 브라우저에서 꺼내 볼 수 있습니다. 학생용은 키 없이 배포하고, 자가 채점 기능만 쓰게 하는 것이 안전합니다.
            </p>
          </div>
          <div className="flex flex-col gap-2">
            <label htmlFor="model" className="eyebrow text-ink2">모델 이름</label>
            <input id="model" type="text" value={model} onChange={e => setModel(e.target.value)}
              className="bg-raise border border-line rounded-xs px-3 py-2 text-[13px] mono" />
            <p className="text-[12px] text-ink3">모델 이름이 바뀌면 이 칸에서 고쳐 주세요.</p>
          </div>
          <div className="flex gap-2">
            <Btn variant="solid" onClick={() => { setSettings({ apiKey: key.trim(), model: model.trim() }); onClose(); }}>저장</Btn>
            <Btn variant="quiet" onClick={() => { setKey(""); setSettings({ apiKey: "", model: model.trim() }); }}>키 지우기</Btn>
          </div>
        </div>
      </Card>
    </div>
  );
}

/* ─────────────────────────── 앱 ─────────────────────────── */
function App() {
  const [store, setStore] = useState(() => readJSON(STORE_KEY, {}));
  const [settings, setSettingsRaw] = useState(() => readJSON(SET_KEY, { apiKey: "", model: "claude-sonnet-4-5" }));
  const [currentId, setCurrentId] = useState(PROBLEMS[0].id);
  const [view, setView] = useState("solve");
  const [listOpen, setListOpen] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [samplerState, sampler] = useSampler();

  useEffect(() => { writeJSON(STORE_KEY, store); }, [store]);
  const setSettings = (s) => { setSettingsRaw(s); writeJSON(SET_KEY, s); };

  const p = PROBLEMS.find(x => x.id === currentId) || PROBLEMS[0];
  const rec = store[currentId] || blank();
  const update = useCallback((fn) => {
    setStore(prev => ({ ...prev, [currentId]: fn(prev[currentId] || blank()) }));
  }, [currentId]);

  const pick = (id) => { setCurrentId(id); setView("solve"); setListOpen(false); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const doneCount = PROBLEMS.filter(x => { const r = store[x.id]; return r && (r.selfDone || r.ai); }).length;

  return (
    <div className="min-h-screen">
      <header className="border-b border-line bg-card">
        <div className="mx-auto max-w-[1180px] px-4 sm:px-6 py-4 flex flex-wrap items-center gap-x-5 gap-y-3">
          <div className="min-w-0 flex-1">
            <div className="eyebrow text-accent">청운고 대비 · 중3 수학</div>
            <h1 className="serif text-[20px] sm:text-[23px] font-bold leading-tight mt-0.5">구술면접 연습실</h1>
          </div>
          <div className="flex items-center gap-2 no-print">
            <div className="hidden sm:flex items-center gap-2 mr-1">
              <div className="h-1 w-24 bg-line rounded-full overflow-hidden">
                <div className="h-full bg-accent transition-all" style={{ width: (doneCount / PROBLEMS.length * 100) + "%" }} />
              </div>
              <span className="mono text-[12px] text-ink2">{doneCount}/{PROBLEMS.length}</span>
            </div>
            <Btn variant={view === "solve" ? "solid" : "ghost"} onClick={() => setView("solve")}>연습</Btn>
            <Btn variant={view === "progress" ? "solid" : "ghost"} onClick={() => setView("progress")}>현황</Btn>
            <Btn variant="quiet" onClick={() => setShowSettings(true)} title="교사용 설정">설정</Btn>
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-[1180px] px-4 sm:px-6 py-6 pb-24">
        {view === "progress" ? (
          <Progress store={store} onPick={pick} onReset={() => {
            if (window.confirm("모든 답변과 채점 기록을 지웁니다. 되돌릴 수 없습니다. 계속할까요?")) setStore({});
          }} />
        ) : (
          <div className="grid gap-6 lg:grid-cols-[264px_minmax(0,1fr)] items-start">
            <div className="lg:sticky lg:top-6">
              <div className="lg:hidden mb-3 no-print">
                <Btn variant="ghost" className="w-full" onClick={() => setListOpen(o => !o)}>
                  {listOpen ? "문항 목록 닫기" : "문항 목록 열기 (" + p.no + "/" + PROBLEMS.length + ")"}
                </Btn>
              </div>
              <div className={listOpen ? "block" : "hidden lg:block"}>
                <ProblemList current={currentId} onPick={pick} store={store} onClose={() => setListOpen(false)} />
              </div>
            </div>
            <ProblemView p={p} rec={rec} update={update} sampler={sampler} samplerState={samplerState} settings={settings} />
          </div>
        )}
      </main>

      <footer className="border-t border-line">
        <div className="mx-auto max-w-[1180px] px-4 sm:px-6 py-6 text-[12px] text-ink3 leading-relaxed">
          답변과 채점 기록은 이 브라우저에만 저장됩니다. 기기를 바꾸거나 브라우저 기록을 지우면 사라집니다.
        </div>
      </footer>

      {showSettings && <Settings settings={settings} setSettings={setSettings} samplerState={samplerState} onClose={() => setShowSettings(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
